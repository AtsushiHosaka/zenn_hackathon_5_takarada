# Lightsail インスタンス上で使うオーバーレイ。**本番モードで動く**。
# イメージは ECR から pull したものをそのまま使う (コードのマウントはしない)。
#   docker compose -f compose.yaml -f infra/compose.deploy.yaml --env-file infra/.env up -d
# 各値は `make infra-apply` が terraform の出力から infra/.env に書き出す。
services:
  api:
    image: ${API_IMAGE:?API_IMAGE が必要です。make infra-apply を先に実行してください}
    environment:
      RAILS_ENV: production
      # 本番では必須。未設定だと起動しない
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE が必要です}
      DEVISE_JWT_SECRET_KEY: ${DEVISE_JWT_SECRET_KEY:-}
      # 空なら素通し。値があると x-origin-secret ヘッダを検証する
      ORIGIN_SECRET: ${ORIGIN_SECRET:-}
      RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
    restart: unless-stopped

  db:
    restart: unless-stopped
