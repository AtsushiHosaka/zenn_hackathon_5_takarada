# ローカル開発用。docker compose が自動で読み込む。
# `-f` を明示した場合 (デプロイ時) は読み込まれない。
services:
  api:
    build: ./backend
    image: hack-api:local
    # ローカルではデモユーザーも入れる
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
               bin/rails db:create db:apply db:seed &&
               bin/rails server -b 0.0.0.0 -p 3000"
    volumes:
      # コードをマウントして編集が即反映されるようにする。
      # デプロイ時はイメージの中身をそのまま使うのでマウントしない
      - ./backend:/app
      - bundle_data:/usr/local/bundle
    tty: true
    stdin_open: true

  # worker も api と同じイメージ・同じマウントで動かす (編集が即反映される)
  worker:
    build: ./backend
    image: hack-api:local
    volumes:
      - ./backend:/app
      - bundle_data:/usr/local/bundle

  # Web フロント (Vite dev server)。**ローカル専用**なので base ではなくここに置く
  # (本番の web は nginx イメージを Cloud Run に載せる。infra/gcp/README.md 参照)
  web:
    build:
      context: ./frontend
      target: dev
    image: hack-web:local
    environment:
      # 「接続先: API」に切り替えたときに叩く先。ブラウザから見た URL を渡す
      VITE_API_ENDPOINT: ${VITE_API_ENDPOINT:-http://localhost:3000}
      # 未指定なら dev はダミー接続で立ち上がる (ログイン画面の「接続先」で切り替え)
      VITE_CONNECTION: ${VITE_CONNECTION:-}
    ports:
      - "5173:5173"
    volumes:
      # コードをマウントして HMR を効かせる
      - ./frontend:/app
      # node_modules はイメージ側を使う (ホストの OS/arch と混ざらないように)
      - node_modules_data:/app/node_modules
      # `npm run types` が読む OpenAPI 定義 (frontend からは ../backend/swagger)
      - ./backend/swagger:/backend/swagger:ro
    tty: true
    stdin_open: true

volumes:
  bundle_data:
  node_modules_data:
