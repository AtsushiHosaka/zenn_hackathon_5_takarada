# ローカル開発用。docker compose が自動で読み込む。
# `-f` を明示した場合 (デプロイ時) は読み込まれない。
services:
  api:
    build: ./backend
    image: hack-api:local
    # ローカルではデモユーザーも入れる
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
               bin/rails db:create db:apply db:seed &&
               bin/rails server -b 0.0.0.0 -p 3000"
    volumes:
      # コードをマウントして編集が即反映されるようにする。
      # デプロイ時はイメージの中身をそのまま使うのでマウントしない
      - ./backend:/app
      - bundle_data:/usr/local/bundle
    tty: true
    stdin_open: true

volumes:
  bundle_data:
