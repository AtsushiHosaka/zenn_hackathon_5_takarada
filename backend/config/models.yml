# 3D モデル (GLB) の対応表。ModelResolver がシーンの model_url を埋めるのに使う。
#
# ここに載っていないものは model_url が null のままになり、クライアントが
# category と size から箱で描く。GLB を足すときは
#   1. gs://<MODELS_BUCKET>/models/v1/... に置く
#   2. ここに 1 行足す
# の 2 手順。差し替えでキャッシュを切るため key には版 (v1) を入れる。
#
# モデルの決まりごと (単位・正面・原点・ポリゴン数) は
# specs/room-coordination/spec.md の「3D モデル」を参照。
# fit / tint はクライアントと合意できていないので、まだ API には出していない。

# カテゴリ別の汎用モデル。既存家具と専用モデルの無い商品に使う
categories: {}
# 例:
#   bed: models/v1/categories/bed.glb
#   desk: models/v1/categories/desk.glb

# item_id ごとの専用モデル。デモの主役の商品だけ用意する
items: {}
# 例:
#   1042: models/v1/items/1042.glb
