# 部屋の写真の保存先。いまはローカルのディスク (storage/) だけ。
# ローカル: api と worker は同じ backend/ をマウントしているので、api が保存した写真を worker が読める。
# 本番 (Cloud Run): ジョブは :inline で写真を受け取ったリクエストの中で動くので、同じコンテナのディスクで足りる。
#   ただしコンテナが止まると写真は消える。ジョブを別のコンテナで動かすようにしたら GCS が必要になる。
local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>
