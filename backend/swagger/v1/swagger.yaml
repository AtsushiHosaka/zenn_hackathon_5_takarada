        product_metadata:
          "$ref": "#/components/schemas/ProductMetadata"
        model_url:
          type: string
          nullable: true
          example:
        model_match:
          allOf:
          - "$ref": "#/components/schemas/ModelMatch"
          nullable: true
          example:
        model_size:
          allOf:
          - "$ref": "#/components/schemas/Size"
          nullable: true
          example:
        model_fit:
          type: string
          enum:
          - contain
