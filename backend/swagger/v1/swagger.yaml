            - h
            - d
          example: []
        material:
          type: string
          example: スチール
        shape:
          type: string
          nullable: true
          example:
        image_usage:
          type: object
          additionalProperties: true
          example:
            generation_input: not_used
      additionalProperties: true
    CoordinationInput:
      type: object
      properties:
        coordination:
          type: object
          properties:
            prompt:
              type: string
              example: 紫色の推し活ルームにしたい
