---
openapi: 3.0.1
info:
  title: API V1
  version: v1
  description: Rails API
paths:
  "/api/v1/assets/{key}":
    parameters:
    - name: key
      in: path
      required: true
      description: textures/description-seamless-v1/<64桁のハッシュ>.png等
      schema:
        type: string
    get:
      summary: 開発環境の生成テクスチャを取得する
      tags:
      - Assets
      description: 開発・テスト限定。本番は404となり、SceneObjectのGCS公開texture_urlを使用する。
      security: []
      responses:
        '200':
          description: 生成画像
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
  "/api/v1/signup":
    post:
      summary: サインアップしてトークンを受け取る
      tags:
      - Auth
      security: []
      parameters: []
      responses:
        '201':
          description: 作成に成功。Authorization ヘッダに Bearer トークンが載る
          headers:
            Authorization:
              schema:
                type: string
              description: Bearer <JWT>
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '503':
          description: 正式文書の未設定により新規登録を停止中
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationErrors"
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationErrors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SignupInput"
  "/api/v1/login":
    post:
      summary: ログインしてトークンを受け取る
      tags:
      - Auth
      security: []
      parameters: []
      responses:
        '200':
          description: ログイン成功。Authorization ヘッダに Bearer トークンが載る
          headers:
            Authorization:
              schema:
                type: string
              description: Bearer <JWT>
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '401':
          description: メールアドレスかパスワードが違う
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginInput"
  "/api/v1/logout":
    delete:
      summary: ログアウトしてトークンを失効させる
      tags:
      - Auth
      security:
      - bearerAuth: []
      responses:
        '204':
          description: 失効に成功。以降このトークンでは 401 になる
        '401':
          description: トークンが無い
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Unauthorized"
  "/api/v1/me":
    get:
      summary: トークンの持ち主を返す
      tags:
      - Auth
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 取得に成功
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '401':
          description: トークンが不正
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Unauthorized"
  "/api/v1/rooms/{room_id}/coordinations":
    parameters:
    - name: room_id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: コーデ提案の生成を始める
      tags:
      - Coordinations
      description: GET /api/v1/coordinations/{id} で status が done / failed になるまで待つ。本番inline実行ではPOSTも処理完了を待つ。Geminiの設定とownerの利用許可があれば公式EC商品を検索し、配置後に既存モデルの素材テクスチャを生成する。未設定時はモック。furniture_operationsで既存家具のkeep/replace/remove、additionsで最大6点の大型家具追加を指定できる。写真で見つからなかった所有家具はedited_objectsにmanual-UUIDのidとlabel/categoryを含める。本人の部屋・提案だけ扱う
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: '受付に成功 (status: pending)'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Coordination"
        '401':
          description: ログインが必要
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Unauthorized"
        '404':
          description: 本人の部屋ではない
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NotFound"
        '422':
          description: 部屋の解析が終わっていない、または入力が不正
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationErrors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CoordinationInput"
  "/api/v1/coordinations/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: コーデ提案 (配置後のシーンと購入リンク) を取得する
      tags:
      - Coordinations
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 生成済みのコーデ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Coordination"
        '404':
          description: 本人のコーデではない
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NotFound"
  "/api/v1/furniture_imports":
    post:
      summary: 商品リンクから所有家具の情報を取得する
      tags:
      - FurnitureImports
      description: 対応ショップの商品詳細HTMLを取得・検証する。取得と解析は最大45秒。実商品名・円価格・寸法の根拠を確認できない場合や対応外カテゴリは422。未掲載の寸法は推定軸として明示する。モデルが無い場合はnullを返す。購入提案や予算の合計には追加しない。
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: 商品情報を確認できた
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ImportedFurniture"
        '401':
          description: ログインが必要
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Unauthorized"
        '422':
          description: 商品を取得・確認できない
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationErrors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/FurnitureImportInput"
  "/api/v1/furniture_models":
    get:
      summary: 利用できる 3D 家具モデルを一覧で取得する
      tags:
      - FurnitureModels
      description: 寸法はメートル。GCS の公開ベース URL が未設定の場合、model_url は null。
      security: []
      responses:
        '200':
          description: モデル一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/FurnitureModel"
  "/api/v1/furniture_models/{id}":
    parameters:
    - name: id
      in: path
      required: true
      description: モデルの安定 ID (GLB ファイル名から拡張子を除いた値)
      schema:
        type: string
    get:
      summary: 3D 家具モデルのメタデータを取得する
      tags:
      - FurnitureModels
      security: []
      responses:
        '200':
          description: モデルのメタデータ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FurnitureModel"
        '404':
          description: モデルが無い、または無効
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NotFound"
  "/api/v1/rooms":
    get:
      summary: 本人の部屋一覧を取得する
      tags:
      - Rooms
      description: 本人の部屋をIDの降順で返す。部屋がない場合は空の配列を返す。解析中・失敗した部屋も含み、各部屋に最後に成功した提案を返す。
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 部屋一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Room"
        '401':
          description: ログインが必要
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Unauthorized"
    post:
      summary: 部屋を登録して解析を始める
      tags:
      - Rooms
      description: 解析は非同期。GET /api/v1/rooms/{id} で status が ready になるまでポーリングする。写真と
        Gemini の設定がある場合は AI で解析し、無い場合は畳数と形からモックを作る。登録・取得は本人の部屋のみ
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: '登録に成功 (status: analyzing)'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Room"
        '401':
          description: ログインが必要
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Unauthorized"
        '422':
          description: 畳数が範囲外
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationErrors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RoomInput"
  "/api/v1/rooms/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: 部屋と解析結果 (シーン) を取得する
      tags:
      - Rooms
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 解析済みの部屋
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Room"
        '404':
          description: 部屋が無い、または本人の部屋ではない
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NotFound"
  "/api/v1/uploads":
    post:
      summary: 部屋写真のアップロード先を発行する
      tags:
      - Uploads
      description: |
        写真は Rails を通さず、ここで得た upload_url へブラウザから直接 PUT する。
        PUT には Content-Type だけを付ける (署名と食い違うヘッダがあると GCS が 403 を返す)。
        size も署名に含まれるため、実際に送る大きさと一致させる。
        アップロード後、key を POST /api/v1/rooms の photo_keys に渡す。
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: 発行に成功
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Upload"
        '401':
          description: ログインが必要
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Unauthorized"
        '422':
          description: 対応していない形式
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationErrors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UploadInput"
  "/api/v1/users":
    get:
      summary: 本人のプロフィールを一覧形式で取得する
      tags:
      - Users
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 一覧が返る
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/User"
        '401':
          description: トークンが無い
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Unauthorized"
  "/api/v1/users/{id}":
    parameters:
    - name: id
      in: path
      description: User ID
      required: true
      schema:
        type: integer
    get:
      summary: 本人のプロフィールを取得する
      tags:
      - Users
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 取得に成功
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '404':
          description: ユーザーが存在しない、または他のユーザー
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NotFound"
    patch:
      summary: ユーザーを更新する
      tags:
      - Users
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: 更新に成功
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '404':
          description: 本人のプロフィールではない
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NotFound"
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationErrors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UserInput"
    delete:
      summary: ユーザーを削除する
      tags:
      - Users
      security:
      - bearerAuth: []
      responses:
        '204':
          description: 削除に成功
        '404':
          description: ユーザーが存在しない、または他のユーザー
servers:
- url: http://localhost:3000
  description: Local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: POST /api/v1/login のレスポンスヘッダ Authorization の値をそのまま使う
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Taro Yamada
        email:
          type: string
          format: email
          example: taro@example.com
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - email
      - created_at
      - updated_at
    SignupInput:
      type: object
      properties:
        user:
          type: object
          properties:
            name:
              type: string
              example: Taro Yamada
            email:
              type: string
              format: email
              example: taro@example.com
            password:
              type: string
              format: password
              minLength: 8
              example: password
          required:
          - name
          - email
          - password
      required:
      - user
    LoginInput:
      type: object
      properties:
        identity:
          type: object
          properties:
            email:
              type: string
              format: email
              example: user1@example.com
            password:
              type: string
              format: password
              example: password
          required:
          - email
          - password
      required:
      - identity
    UserInput:
      type: object
      properties:
        user:
          type: object
          properties:
            name:
              type: string
              example: Taro Yamada
          required:
          - name
      required:
      - user
    ValidationErrors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
          example:
          - Identity email has already been taken
      required:
      - errors
    Unauthorized:
      type: object
      properties:
        error:
          type: string
          example: メールアドレスまたはパスワードが違います
      required:
      - error
    NotFound:
      type: object
      properties:
        error:
          type: string
          example: Couldn't find User with 'id'=999
      required:
      - error
    Size:
      type: object
      description: 'メートル。w: 幅 (ローカル x), h: 高さ, d: 奥行き (ローカル z)'
      properties:
        w:
          type: number
          example: 0.97
        h:
          type: number
          example: 0.45
        d:
          type: number
          example: 1.95
      required:
      - w
      - h
      - d
    FurnitureModelBinding:
      type: object
      properties:
        kind:
          type: string
          enum:
          - existing
          - product
          example: existing
        reference:
          type: string
          description: 既存家具の object ID または商品の ID
          example: bed-1
      required:
      - kind
      - reference
    FurnitureModel:
      type: object
      properties:
        id:
          type: string
          description: 安定 ID。GLB ファイル名から拡張子を除いた値
          example: bed_single
        name:
          type: string
          example: シングルベッド
        category:
          type: string
          example: bed
        shape:
          type: string
          example: bed_single
        variant:
          type: string
          nullable: true
          example:
        format:
          type: string
          enum:
          - glb
          example: glb
        object_key:
          type: string
          description: 公開ベース URL からの相対 GCS オブジェクトパス
          example: furniture/bed_single.glb
        size:
          "$ref": "#/components/schemas/Size"
        unit:
          type: string
          enum:
          - meter
          example: meter
        axes:
          type: string
          enum:
          - "+Y up, +Z front, origin bottom center"
          example: "+Y up, +Z front, origin bottom center"
        triangle_count:
          type: integer
          minimum: 0
          example: 1200
        byte_size:
          type: integer
          minimum: 1
          example: 48000
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        materials:
          type: array
          items:
            type: string
          example:
          - wood
          - fabric
        model_url:
          type: string
          nullable: true
          description: GCS の公開 GLB URL。ベース URL が未設定なら null
          example:
        bindings:
          type: array
          items:
            "$ref": "#/components/schemas/FurnitureModelBinding"
      required:
      - id
      - name
      - category
      - shape
      - variant
      - format
      - object_key
      - size
      - unit
      - axes
      - triangle_count
      - byte_size
      - sha256
      - materials
      - model_url
      - bindings
    Position:
      type: object
      description: 物体の底面中心 (メートル)。原点は北西の床の角、x は東向き、y は上、z は南向き
      properties:
        x:
          type: number
          example: 0.51
        "y":
          type: number
          example: 0.0
        z:
          type: number
          example: 1.0
      required:
      - x
      - "y"
      - z
    Door:
      type: object
      properties:
        id:
          type: string
          example: door-1
        wall:
          type: string
          enum:
          - north
          - south
          - east
          - west
          example: west
        center:
          type: number
          description: 壁に沿ったドアの中心位置 (north/south は x、east/west は z)
          example: 3.16
        width:
          type: number
          example: 0.8
        height:
          type: number
          example: 2.0
        kind:
          type: string
          enum:
          - entrance
          - closet
          description: 'entrance: 部屋の出入り口 / closet: クローゼット・押し入れの扉'
          example: entrance
      required:
      - id
      - wall
      - center
      - width
      - height
      - kind
    Window:
      type: object
      properties:
        id:
          type: string
          example: window-1
        wall:
          type: string
          enum:
          - north
          - south
          - east
          - west
          example: south
        center:
          type: number
          description: 壁に沿った窓の中心位置 (north/south は x、east/west は z)
          example: 1.35
        width:
          type: number
          example: 1.2
        bottom:
          type: number
          description: 床から窓の下端までの高さ
          example: 0.9
        height:
          type: number
          example: 1.1
      required:
      - id
      - wall
      - center
      - width
      - bottom
      - height
    RoomShape:
      type: object
      properties:
        width:
          type: number
          description: 東西方向 (x) の長さ
          example: 2.7
        depth:
          type: number
          description: 南北方向 (z) の長さ
          example: 3.6
        height:
          type: number
          example: 2.4
        wall_color:
          type: string
          example: "#f4f1ec"
        floor_color:
          type: string
          example: "#c8a97e"
        windows:
          type: array
          items:
            "$ref": "#/components/schemas/Window"
        doors:
          type: array
          items:
            "$ref": "#/components/schemas/Door"
          description: ドア (部屋の出入り口・クローゼットの扉)。前の床 0.8m には家具・商品を置かない。古いシーンには無い
      required:
      - width
      - depth
      - height
      - wall_color
      - floor_color
      - windows
    SceneObject:
      type: object
      properties:
        id:
          type: string
          example: bed-1
        source:
          type: string
          enum:
          - existing
          - suggested
          description: 'existing: 今ある家具, suggested: AI の追加提案'
          example: existing
        category:
          type: string
          example: bed
        label:
          type: string
          example: ベッド
        size:
          "$ref": "#/components/schemas/Size"
        position:
          "$ref": "#/components/schemas/Position"
        rotation_y:
          type: number
          minimum: 0
          exclusiveMaximum: true
          maximum: 360
          description: '度数。正面 (ローカル +z) が 0: 南, 90: 東, 180: 北, 270: 西 を向く (three.js
            の rotation.y と同じ)'
          example: 0
        color:
          type: string
          example: "#f2f0eb"
        ec_product_id:
          type: integer
          minimum: 1
          description: リンクから補完した所有家具のEcProduct ID
          example: 1
        price:
          type: integer
          minimum: 1
          description: 所有家具の参考価格。今回の購入商品合計には含めない
          example: 7990
        shop:
          type: string
          example: IKEA
        url:
          type: string
          example: https://www.ikea.com/jp/ja/p/example-chair-12345678/
        image_url:
          type: string
          nullable: true
          description: 商品ページに掲載された写真URL
          example: https://www.ikea.com/jp/ja/images/products/teodores-chair-white__0727344_pe735616_s5.jpg
        product_metadata:
          "$ref": "#/components/schemas/ProductMetadata"
        model_url:
          type: string
          nullable: true
          description: GLB の URL。null なら category と size から箱などで代わりに描く
          example:
        slot:
          type: string
          nullable: true
          enum:
          -
          - bed_cover
          - curtain
          - rug
          - wall_decor
          - light
          - display
          - cushion
          - desk_top
          - floor
          description: suggested の置き場所の枠
          example:
        attach_to:
          type: string
          nullable: true
          description: 付けた先の家具・窓の id
          example:
        item_id:
          type: integer
          nullable: true
          description: suggested の商品 id (Coordination.items と対応)
          example:
        marker:
          type: integer
          nullable: true
          description: suggested の番号マーカー (Coordination.items と対応)
          example:
        replaces_object_id:
          type: string
          nullable: true
          example: bed-1
        model_size:
          "$ref": "#/components/schemas/Size"
        model_fit:
          type: string
          enum:
          - contain
          example: contain
        model_match:
          "$ref": "#/components/schemas/ModelMatch"
        texture_status:
          type: string
          enum:
          - disabled
          - ready
          - failed
          - skipped
          - unmatched
          example: ready
        texture_source:
          type: string
          enum:
          - description
          example: description
        material_overrides:
          type: object
          additionalProperties:
            "$ref": "#/components/schemas/MaterialOverride"
          example: {}
      required:
      - id
      - source
      - category
      - label
      - size
      - position
      - rotation_y
      - color
      - model_url
      - slot
      - attach_to
      - item_id
      - marker
    Scene:
      type: object
      properties:
        room:
          "$ref": "#/components/schemas/RoomShape"
        objects:
          type: array
          items:
            "$ref": "#/components/schemas/SceneObject"
      required:
      - room
      - objects
    UploadInput:
      type: object
      properties:
        uploads:
          type: array
          maxItems: 4
          items:
            type: object
            properties:
              content_type:
                type: string
                enum:
                - image/jpeg
                - image/png
                - image/webp
                example: image/jpeg
              size:
                type: integer
                maximum: 10485760
                description: バイト数。署名に含めるので実際に送る大きさと一致させる
                example: 284113
            required:
            - content_type
            - size
      required:
      - uploads
    Upload:
      type: object
      properties:
        key:
          type: string
          description: POST /api/v1/rooms の photo_keys に渡す
          example: photos/users/1/01a105cb-f338-72a2-b843-7de9d31431a1/0.jpg
        upload_url:
          type: string
          description: この URL へ写真を PUT する。Content-Type だけを付け、他のヘッダは足さない (署名と食い違うと
            403)
          example: https://storage.googleapis.com/example-uploads/photos/users/1/01a105cb-f338-72a2-b843-7de9d31431a1/0.jpg?X-Goog-Algorithm=GOOG4-RSA-SHA256
      required:
      - key
      - upload_url
    RoomInput:
      type: object
      properties:
        room:
          type: object
          properties:
            tatami:
              type: number
              minimum: 3
              maximum: 30
              description: 部屋の広さ (畳)
              example: 6
            shape:
              type: string
              enum:
              - square
              - standard
              - long
              description: '部屋の形。square: 正方形に近い (1:1.15), standard: やや縦長 (3:4), long:
                細長い (1:2)'
              example: standard
            photo_keys:
              type: array
              items:
                type: string
              description: POST /api/v1/uploads で得た key。アップロード済みのものだけ受け付ける。省略すると写真なしで解析する
              example: []
          required:
          - tatami
          - shape
      required:
      - room
    Room:
      type: object
      properties:
        id:
          type: integer
          example: 1
        tatami:
          type: number
          example: 6.0
        shape:
          type: string
          enum:
          - square
          - standard
          - long
          example: standard
        status:
          type: string
          enum:
          - analyzing
          - ready
          - failed
          example: ready
        scene:
          allOf:
          - "$ref": "#/components/schemas/Scene"
          nullable: true
          description: status が ready になると入る
        analyzed_by:
          type: string
          nullable: true
          enum:
          -
          - gemini
          - mock
          description: 'gemini: 写真を AI で解析した / mock: 写真か API キーが無く、決まった家具を置いたモック。解析が終わると入る'
          example: gemini
        error_message:
          type: string
          nullable: true
          example:
        latest_coordination:
          allOf:
          - "$ref": "#/components/schemas/Coordination"
          nullable: true
          description: この部屋で最後に生成が成功した提案。提案がなければ null
        created_at:
          type: string
          format: date-time
      required:
      - id
      - tatami
      - shape
      - status
      - scene
      - analyzed_by
      - error_message
      - latest_coordination
      - created_at
    FurnitureEdit:
      type: object
      description: 編集した家具・商品の配置。写真で見つからなかった所有家具はmanual-UUIDのidとlabel/categoryで補完する。元の解析結果は変更しない
      properties:
        id:
          type: string
          description: 元の家具、この部屋で採用済みの商品、またはmanual-UUID形式の所有家具id
          example: bed-1
        label:
          type: string
          maxLength: 100
          description: 手動で補完した所有家具では必須
          example: 今ある椅子
        category:
          type: string
          enum:
          - sofa
          - bed
          - desk
          - chair
          - shelf
          - table
          description: 手動で補完した所有家具では必須
          example: chair
        ec_product_id:
          type: integer
          minimum: 1
          description: 商品リンクのインポート結果のID。商品・モデル情報はサーバー側で復元する
          example: 1
        position:
          "$ref": "#/components/schemas/Position"
        size:
          "$ref": "#/components/schemas/Size"
        rotation_y:
          type: number
          minimum: 0
          exclusiveMaximum: true
          maximum: 360
          example: 15
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          example: "#f2f0eb"
      required:
      - id
      - position
      - size
      - rotation_y
      - color
    FurnitureOperation:
      type: object
      properties:
        object_id:
          type: string
          example: bed-1
        action:
          type: string
          enum:
          - keep
          - replace
          - remove
          example: keep
      required:
      - object_id
      - action
    FurnitureAddition:
      type: object
      properties:
        category:
          type: string
          enum:
          - sofa
          - bed
          - desk
          - chair
          - shelf
          - table
