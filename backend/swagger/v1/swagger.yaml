      - color
      - size
      - price
      - shop
      - url
      - product_metadata
      - model_url
      - model_match
      - model_size
      - model_fit
    MaterialOverride:
      type: object
      properties:
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          example: "#ffffff"
        texture_url:
          type: string
          example: https://storage.googleapis.com/example-models/textures/v1/tile.png
