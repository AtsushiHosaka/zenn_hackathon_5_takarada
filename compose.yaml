# ベース定義。ローカルでは compose.override.yaml が自動で重なり、
# デプロイ時は infra/compose.deploy.yaml を明示的に重ねる。
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # ローカルは compose.override.yaml が build して同じタグを付ける。
    # デプロイ時は ECR のイメージ URI が入る
    image: ${API_IMAGE:-hack-api:local}
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
               bin/rails db:create db:apply &&
               bin/rails server -b 0.0.0.0 -p 3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: app
      RAILS_ENV: ${RAILS_ENV:-development}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
