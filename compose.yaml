# ローカル開発のベース定義。compose.override.yaml が自動で重なる。
# デプロイ先は Cloud Run なので compose は使わない (infra/gcp/README.md 参照)。
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 非同期処理 (sidekiq) のキュー置き場
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # compose.override.yaml が build して同じタグを付ける
    image: ${API_IMAGE:-hack-api:local}
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
               bin/rails db:create furniture_texture:clear_legacy db:apply character:import furniture:import furniture_texture:import furniture_detail:import &&
               bin/rails server -b 0.0.0.0 -p 3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: app
      REDIS_URL: redis://redis:6379/0
      RAILS_ENV: ${RAILS_ENV:-development}
      # ローカルは GCS を使わず tmp/storage に置く (Storage::LocalClient)。
      # 家具GLBは公開GCSから読む。未設定なら簡易形状を使う。
      MODELS_BUCKET: ${MODELS_BUCKET:-}
      FURNITURE_MODEL_BASE_URL: ${FURNITURE_MODEL_BASE_URL:-}
      UPLOADS_BUCKET: local-uploads
      VITE_TERMS_URL: ${VITE_TERMS_URL:-}
      VITE_PRIVACY_URL: ${VITE_PRIVACY_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ジョブを実行するプロセス。api と同じイメージで sidekiq だけを動かす
  worker:
    image: ${API_IMAGE:-hack-api:local}
    command: bundle exec sidekiq -C config/sidekiq.yml
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: app
      REDIS_URL: redis://redis:6379/0
      RAILS_ENV: ${RAILS_ENV:-development}
      MODELS_BUCKET: ${MODELS_BUCKET:-}
      FURNITURE_MODEL_BASE_URL: ${FURNITURE_MODEL_BASE_URL:-}
      UPLOADS_BUCKET: local-uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # DB の作成とスキーマ適用は api 側のコマンドが担うので先に起こす
      api:
        condition: service_started

volumes:
  pg_data:
