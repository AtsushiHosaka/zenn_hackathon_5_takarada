server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ファイル名にハッシュが入るので長期キャッシュして良い
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: ルーティングはクライアント側が持つ
  location / {
    try_files $uri $uri/ /index.html;
  }
}
