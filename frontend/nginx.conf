server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 同一オリジンの API を GCP へ中継する。ブラウザの JWT ヘッダも引き継ぐ。
  location ~ ^/(api/|api-docs/) {
    proxy_pass ${API_UPSTREAM_ORIGIN};
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    # 商品検索・選定・画像生成はjob全体240秒。POSTのブラウザ期限は270秒。
    proxy_read_timeout 260s;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Cache-Control "no-store" always;
  }

  # ファイル名にハッシュが入るので長期キャッシュして良い
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: ルーティングはクライアント側が持つ
  location / {
    try_files $uri $uri/ /index.html;
  }
}
