name: Deploy

# main に入ったら CI の完了を待ってデプロイする
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write   # Workload Identity で GCP の資格情報に交換するのに必要
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # サービスアカウントキーは置かない。GitHub が発行する OIDC トークンを
      # GCP 側で検証して、短命の資格情報に交換する
      - name: GCP の認証 (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Artifact Registry にログイン
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: API のイメージをビルドして push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.GCP_API_IMAGE_REPO }}:${{ github.event.workflow_run.head_sha }}
            ${{ secrets.GCP_API_IMAGE_REPO }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Web フロントのイメージをビルドして push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runtime
          platforms: linux/amd64
          push: true
          # VITE_ で始まる値はビルド時にバンドルへ埋め込まれる
          build-args: |
            VITE_API_ENDPOINT=${{ secrets.GCP_API_URL }}
            VITE_CONNECTION=api
          tags: |
            ${{ secrets.GCP_WEB_IMAGE_REPO }}:${{ github.event.workflow_run.head_sha }}
            ${{ secrets.GCP_WEB_IMAGE_REPO }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # 新しいコードを出す前にスキーマを当てる (ridgepole)
      - name: db/Schemafile を Cloud SQL に適用
        run: |
          gcloud run jobs update "${{ secrets.GCP_TASK_JOB }}" \
            --image "${{ secrets.GCP_API_IMAGE_REPO }}:$SHA" \
            --args db:apply \
            --region "${{ secrets.GCP_REGION }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" --quiet
          gcloud run jobs execute "${{ secrets.GCP_TASK_JOB }}" \
            --region "${{ secrets.GCP_REGION }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" --wait

      - name: Cloud Run を更新
        run: |
          gcloud run services update "${{ secrets.GCP_API_SERVICE }}" \
            --image "${{ secrets.GCP_API_IMAGE_REPO }}:$SHA" \
            --region "${{ secrets.GCP_REGION }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" --quiet
          gcloud run services update "${{ secrets.GCP_WEB_SERVICE }}" \
            --image "${{ secrets.GCP_WEB_IMAGE_REPO }}:$SHA" \
            --region "${{ secrets.GCP_REGION }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" --quiet

      - name: 疎通確認
        env:
          URL: ${{ secrets.GCP_API_URL }}
        run: |
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/up" || true)
            [ "$code" = "200" ] && echo "OK" && exit 0
            sleep 5
          done
          echo "デプロイ後に /up が 200 になりませんでした" >&2
          exit 1
