name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: backend

      - name: Setup database
        run: bin/rails db:create db:apply

      - name: Run specs (E2E)
        run: bundle exec rspec

      - name: OpenAPI ドキュメントが最新かチェック
        run: |
          bundle exec rails rswag
          git diff --exit-code swagger/ \
            || (echo "swagger/ が古いです。rails rswag を実行してコミットしてください" && exit 1)

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: backend
      - run: bin/rubocop -f github

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - name: ビルド (型チェックを含む)
        run: npm run build

      - name: OpenAPI から生成した型が最新かチェック
        run: |
          npm run types
          git diff --exit-code src/data/generated/ \
            || (echo "src/data/generated/ が古いです。make front-types を実行してコミットしてください" && exit 1)
